# Hiera-tiny fine-tuning on iNaturalist 2019 (1,010 species).
# Paths are relative to BIODIV_DATA_ROOT unless absolute. The 2024 run used the
# Vector cluster copies under /datasets/inat_comp/2019 (images) and a scratch
# copy of the annotation files.
dataset_name: inat2019
train_json: inat_comp/2019/train2019.json
val_json: inat_comp/2019/val2019.json
categories_json: inat_comp/2019/categories.json   # un-obfuscated names (optional)
image_root: inat_comp/2019                        # file_name values start with train_val2019/
image_size: 224
batch_size: 512
eval_batch_size: 512
num_workers: 8

model_name: hiera_tiny_224
model_checkpoint: mae_in1k          # MAE pretrained on ImageNet-1k (no labels), random head
pretrained: true
drop_path_rate: 0.1                 # NOTE: historical runs effectively used 0.0 (see docs/changes.md)

epochs: 300
warmup_epochs: 5
base_lr: 2.0e-3
layer_decay: 0.65
weight_decay: 0.05
betas: [0.9, 0.999]
label_smoothing: 0.1
mixup_alpha: 0.8                    # NOTE: historical runs used torchvision's default 1.0
cutmix_alpha: 1.0
amp: true

horizontal_flip: true
randaugment_num_ops: 9
randaugment_magnitude: 1            # as in the 2024 scripts (torchvision scale 0-30)

run_name: hiera_tiny_inat2019
checkpoint_every: 10
resume: auto
seed: 0
wandb:
  enabled: false
  project: hiera_inat2019_transfer_learning
  entity: null
